<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="일렉기타·피아노·베이스의 코드 사전, 키별 코드, 스케일 도감, 리프 만들기가 들어 있는 연습 앱">
<meta name="theme-color" content="#18212C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="악기 도감">
<title>악기 코드 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="wrap">

<section id="home">
  <h1 class="ht">악기 코드 도감</h1>
  <p class="lead">코드 사전, 키별 코드, 스케일 도감, 리프 만들기를 악기별로 볼 수 있어요. 연습할 악기를 골라 주세요.</p>
  <div class="inst">
    <button class="ic" id="pick-guitar" data-inst="guitar">
      <svg class="ico" viewBox="0 0 120 70" aria-hidden="true"><line class="s" x1="10" y1="8" x2="10" y2="62" style="stroke-width:5"/><g class="s"><line x1="10" y1="8" x2="112" y2="8"/><line x1="10" y1="19" x2="112" y2="19"/><line x1="10" y1="30" x2="112" y2="30"/><line x1="10" y1="41" x2="112" y2="41"/><line x1="10" y1="52" x2="112" y2="52"/><line x1="10" y1="62" x2="112" y2="62"/><line x1="36" y1="8" x2="36" y2="62"/><line x1="61" y1="8" x2="61" y2="62"/><line x1="86" y1="8" x2="86" y2="62"/><line x1="112" y1="8" x2="112" y2="62"/></g><circle class="f" cx="48" cy="19" r="5"/><circle class="f" cx="73" cy="41" r="5"/><circle class="r" cx="73" cy="30" r="5"/><circle class="a" cx="98" cy="52" r="5"/></svg>
      <span class="in">일렉기타</span><span class="id">6줄 · 24프렛 · 코드 운지, 스트로크·파워코드·펑크 리프</span><span class="last" hidden>지난번에 쓴 악기</span>
    </button>
    <button class="ic" id="pick-piano" data-inst="piano">
      <svg class="ico" viewBox="0 0 120 70" aria-hidden="true"><g><rect class="w" x="4" y="6" width="16" height="58" rx="2"/><rect class="w" x="20" y="6" width="16" height="58" rx="2"/><rect class="w" x="36" y="6" width="16" height="58" rx="2"/><rect class="w" x="52" y="6" width="16" height="58" rx="2"/><rect class="w" x="68" y="6" width="16" height="58" rx="2"/><rect class="w" x="84" y="6" width="16" height="58" rx="2"/><rect class="w" x="100" y="6" width="16" height="58" rx="2"/></g><rect class="r" x="5" y="40" width="14" height="23" rx="2"/><rect class="a" x="37" y="40" width="14" height="23" rx="2"/><rect class="a" x="69" y="40" width="14" height="23" rx="2"/><g><rect class="b" x="15" y="6" width="10" height="34" rx="1.5"/><rect class="b" x="31" y="6" width="10" height="34" rx="1.5"/><rect class="b" x="63" y="6" width="10" height="34" rx="1.5"/><rect class="b" x="79" y="6" width="10" height="34" rx="1.5"/><rect class="b" x="95" y="6" width="10" height="34" rx="1.5"/></g></svg>
      <span class="in">피아노</span><span class="id">C2~C7 · 코드 누르는 법(한 손·양손·전위), 블록·아르페지오 반주</span><span class="last" hidden>지난번에 쓴 악기</span>
    </button>
    <button class="ic" id="pick-bass" data-inst="bass">
      <svg class="ico" viewBox="0 0 120 70" aria-hidden="true"><line class="s" x1="10" y1="10" x2="10" y2="60" style="stroke-width:5"/><g class="s" style="stroke-width:2.4"><line x1="10" y1="10" x2="114" y2="10"/><line x1="10" y1="27" x2="114" y2="27"/><line x1="10" y1="43" x2="114" y2="43"/><line x1="10" y1="60" x2="114" y2="60"/></g><g class="s"><line x1="36" y1="10" x2="36" y2="60"/><line x1="62" y1="10" x2="62" y2="60"/><line x1="88" y1="10" x2="88" y2="60"/><line x1="114" y1="10" x2="114" y2="60"/></g><circle class="r" cx="49" cy="60" r="6"/><circle class="f" cx="75" cy="43" r="6"/><circle class="a" cx="75" cy="27" r="6"/></svg>
      <span class="in">베이스</span><span class="id">4줄 · 24프렛 · 코드 모양, 근음·옥타브·워킹 베이스 리프</span><span class="last" hidden>지난번에 쓴 악기</span>
    </button>
  </div>
  <div class="feat">
    <div><b>키별 코드</b>곡의 키를 고르면 그 키의 코드를 원하는 위치·조건으로 모아 보여줘요.</div>
    <div><b>코드 사전</b>20가지 코드 종류 × 12개 근음의 가능한 운지(누르는 법)를 모두 보여줘요.</div>
    <div><b>스케일 도감</b>대표 스케일 4가지를 악기 전체와 구간별로 보여줘요.</div>
    <div><b>리프 만들기</b>코드 진행을 넣으면 주법에 맞는 리프를 만들어 반복 재생해요.</div>
  </div>
</section>

<section id="app" hidden>
  <div class="topbar"><button class="btn sec" id="switch">← 악기 바꾸기</button><span id="iname"></span></div>
  <h1 id="apph1"></h1>
  <p class="lead" id="applead"></p>
  <div class="tabs" role="tablist"><button role="tab" id="t-key" aria-selected="true">키별 코드</button><button role="tab" id="t-dic" aria-selected="false">코드 사전</button><button role="tab" id="t-sc" aria-selected="false">스케일 도감</button><button role="tab" id="t-rf" aria-selected="false">리프 만들기</button></div>
  <section id="p-key"></section>
  <section id="p-dic" hidden></section>
  <section id="p-sc" hidden></section>
  <section id="p-rf" class="rf" hidden></section>
  <p class="how" id="readhow" style="margin-top:28px"></p>
</section>

</div>
<script src="theory.js?v=3"></script>
<script src="fretted.js?v=3"></script>
<script src="piano.js?v=3"></script>
<script src="instruments.js?v=3"></script>
<script src="riff-rules.js?v=3"></script>
<script src="sound.js?v=3"></script>
<script src="ui-common.js?v=3"></script>
<script src="tab-key.js?v=3"></script>
<script src="tab-dict.js?v=3"></script>
<script src="tab-scale.js?v=3"></script>
<script src="tab-riff.js?v=3"></script>
<script src="main.js?v=3"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js?v=3',{updateViaCache:'none'}).catch(()=>{})})}</script>
</body>
</html>
